services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "3002:3002"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - NODE_ENV=production
      - PORT=3002
      # Prisma: apuntar la BD sqlite al volume persistente ./backend/data
      - DATABASE_URL=file:/app/backend/data/finance.db
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - REFRESH_EXPIRES_MS=${REFRESH_EXPIRES_MS:-2592000000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - finance-network

  # Frontend dashboard (runs its own built image, no host bind mounts)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3002/api
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-dev-insecure-secret-change-me}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge
