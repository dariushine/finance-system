services:
  # Backend API service (dev)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "3002:3002"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - NODE_ENV=development
      - PORT=3002
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-dev-insecure-secret-change-me}
      - ACCESS_TOKEN_TTL_MS=${ACCESS_TOKEN_TTL_MS:-300000}
      - REFRESH_TTL_SHORT_MS=${REFRESH_TTL_SHORT_MS:-3600000}
      - REFRESH_TTL_LONG_MS=${REFRESH_TTL_LONG_MS:-2592000000}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - finance-network

  # Frontend dashboard (dev)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:3002/api
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-dev-insecure-secret-change-me}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge
